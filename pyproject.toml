[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polyreader"
version = "0.2.0"
description = "Structured polymer data extraction from scientific papers (reasoning-based, vectorless)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml",
    "python-dotenv",
    "tiktoken",
    "marker-pdf==1.10.2",
    "pymupdf",       # still needed by utils/image_utils.py
    "pydantic>=2.0",
    "instructor>=1.0.0",
    "rdkit",
]

[project.scripts]
polyreader = "polyreader.cli:main"
polyextract = "polyreader.cli:main"  # previous command name, kept as an alias

[tool.hatch.build.targets.wheel]
packages = ["polyreader"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
